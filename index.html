<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">

<title>MAC Address Formatter</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px 12px;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

main{
  width:100%;
  max-width:720px;
  margin:auto;
}

.head{
  text-align:center;
  margin-bottom:18px;
}

.logo{
  width:64px;
  height:64px;
  margin:auto;
  border-radius:18px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

h1{
  margin:14px 0 5px;
  font-size:27px;
}

.sub{
  color:#697386;
  font-size:14px;
}

.card{
  background:#fff;
  padding:20px;
  margin:15px 0;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.07);
}

.title{
  font-weight:700;
  font-size:17px;
  margin-bottom:12px;
}

textarea{
  width:100%;
  height:130px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  resize:vertical;
  font:15px Consolas,monospace;
  outline:none;
}

button,
.upload-label{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:12px;
  padding:13px;
  margin-top:12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.primary{
  color:white;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
}

.secondary{
  background:#eeeeee;
  color:#333;
}

.file-box{
  border:2px dashed #c7d2fe;
  padding:18px;
  text-align:center;
  border-radius:15px;
  background:#fafaff;
}

.file-box small{
  display:block;
  color:#697386;
  margin-top:7px;
  line-height:1.5;
}

.desktop-file{
  width:100%;
  margin-top:14px;
}

.mobile-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.mobile-options label{
  margin-top:0;
}

.mobile-input{
  position:absolute;
  left:-9999px;
  width:1px;
  height:1px;
}

.preview{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:contain;
  margin:15px auto 0;
  border-radius:12px;
  border:1px solid #ddd;
}

.status{
  text-align:center;
  color:#697386;
  font-size:13px;
  padding-top:10px;
}

.out{
  background:#111827;
  color:white;
  padding:16px;
  border-radius:12px;
  font:18px Consolas,monospace;
  white-space:pre-wrap;
  min-height:55px;
  overflow-wrap:anywhere;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

@media(max-width:550px){

  body{
    padding:14px 10px;
  }

  .card{
    padding:16px;
    border-radius:17px;
  }

  h1{
    font-size:23px;
  }

  .mobile-options{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:1fr;
  }

  button,
  .upload-label{
    font-size:16px;
  }

  textarea{
    font-size:16px;
  }
}
</style>
</head>

    <input

      capture="environment">


    <img
      id="preview"
      class="preview"
      alt="Preview">

  </div>


  <div
    id="status"
    class="status">

    Choose an image to scan.

  </div>

</div>


<!-- RESULT -->

<div class="card">

  <div class="title">
    ✓ Formatted Result
  </div>

  <div
    id="result"
    class="out">

    Your formatted MAC address will appear here.

  </div>


  <div class="grid">

    <button
      type="button"
      class="primary"
      id="copyButton">

      📋 Copy Result

    </button>


    <button
      type="button"
      class="secondary"
      id="clearButton">

      ↺ Clear

    </button>

  </div>

</div>

</main>
