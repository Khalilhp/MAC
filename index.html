<html lang="en">

<head>
<meta charset="utf-8">

<meta name="viewport"

<title>MAC Address Formatter</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  padding:20px 14px;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

main{
  width:100%;
  max-width:720px;
  margin:auto;
}

.head{
  text-align:center;
  padding:10px 0 18px;
}

.logo{
  margin:auto;
  width:64px;
  height:64px;
  border-radius:18px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  display:grid;
  place-items:center;
  font-size:30px;
  box-shadow:0 8px 20px #4f46e533;
}

h1{
  margin:14px 0 5px;
  font-size:27px;
}

.sub{
  color:#697386;
  font-size:14px;
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:20px;
  box-shadow:0 10px 30px #00000012;
}

.title{
  font-weight:700;
  font-size:17px;
  margin-bottom:12px;
}

textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font:15px Consolas,monospace;
  outline:none;
}

textarea:focus{
  border-color:#6366f1;
  box-shadow:0 0 0 3px #6366f122;
}

button,
.file-button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:12px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  min-height:48px;
  touch-action:manipulation;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
}

.primary{
  color:white;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
}

.secondary{
  background:#eee;
  color:#333;
}

.file{
  border:2px dashed #c7d2fe;
  padding:18px;
  text-align:center;
  border-radius:15px;
  background:#fafaff;
}

.file small{
  display:block;
  margin-top:7px;
  line-height:1.5;
  color:#697386;
}

.file-main-input{
  width:100%;
  margin-top:14px;
  font-size:14px;
}

.mobile-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.mobile-buttons label{
  margin-top:0;
}

.mobile-input{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}

.preview{
  width:100%;
  max-width:100%;
  max-height:320px;
  object-fit:contain;
  margin:15px auto 5px;
  display:none;
  border-radius:12px;
  border:1px solid #ddd;
  background:#f5f5f5;
}

.out{
  background:#111827;
  color:white;
  padding:16px;
  border-radius:12px;
  font:18px Consolas,monospace;
  white-space:pre-wrap;
  min-height:55px;
  overflow-wrap:anywhere;
}

.status{
  text-align:center;
  color:#697386;
  font-size:13px;
  padding:10px 5px 0;
  line-height:1.5;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.grid button{
  margin-top:12px;
}
